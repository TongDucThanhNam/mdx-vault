<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>mdx-vault</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- GOAL-01: MDX evaluate() needs unsafe-eval for trusted vault preview. GOAL-03/05 tighten rendering for untrusted content. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; connect-src 'self' ws: http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; font-src 'self' data:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
