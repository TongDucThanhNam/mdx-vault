<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Normal canvas sandbox</title>
    <style>
      body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 180px; background: #fafafa; }
      .caption { padding: 0.5rem 0.75rem; font-size: 0.75rem; color: #6b7280; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="caption">Arbitrary canvas sandbox. Tries to access parent.document but is blocked by sandbox.</div>
    <script>
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var x = 10;
      var dir = 1;
      function frame() {
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#2563eb';
        ctx.fillRect(x, 60, 30, 30);
        x += dir;
        if (x > canvas.width - 40 || x < 0) dir = -dir;
        requestAnimationFrame(frame);
      }
      frame();
      // Demonstrate that the sandbox cannot reach the parent document.
      try {
        window.parent.document.body.style.background = 'red';
      } catch (err) {
        var warn = document.createElement('div');
        warn.className = 'caption';
        warn.textContent = 'Cross-origin access blocked (expected): ' + err.message;
        document.body.appendChild(warn);
      }
    </script>
  </body>
</html>
